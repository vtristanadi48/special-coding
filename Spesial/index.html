<!DOCTYPE html>
<html lang="id">
<head>
	<!-- Pengaturan dasar halaman dan koneksi ke file CSS -->
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Hadiah Spesial</title>
	<link rel="stylesheet" href="style/style.css" />
</head>
<body>
	<!-- Kartu utama yang tampil saat halaman pertama dibuka -->
	<div class="wrap">
		<div class="card">
			<h1>Untukmu, Riva🤗</h1>
			<p>Ini hadiah kecil: pilih salah satu tombol. Klik buka aja ya jangan gak mau, pokoknya harus buka😉</p>
			<div class="btns">
				<button id="real">Buka Aku</button>
				<button id="troll" tabindex="-1">Gk Mau</button>
			</div>
		</div>
	</div>

	<!-- Fitur musik dipisahkan agar index.html tetap ringkas -->
	<script src="Javascript/music.js"></script>
	<script>
		(function(){
			// Mengambil tombol utama dari halaman
			const troll = document.getElementById('troll');
			const real = document.getElementById('real');

			// Template modal surat yang ditambahkan ke body saat tombol dibuka
			const letterHtml = `
				<div id="modal" class="modal" aria-hidden="true">
					<div class="modal-overlay"></div>
					<div class="modal-panel" role="dialog" aria-modal="true">
						<div class="envelope-body"></div>
						<div class="envelope-flap"><span class="envelope-seal">♥</span></div>
						<div class="letter-paper">
							<button class="close" aria-label="Tutup">×</button>
							<h2>Surat Untukmu</h2>
							<div class="letter-actions">
								<button class="resume-scroll" type="button">Lanjutkan auto-scroll</button>
							</div>
							<div class="letter-content" id="letterContent">
								<p>Dear Riva,</p>
								<p>Aku nggak tahu harus mulai dari mana, karena semakin aku pikirkan, semakin banyak hal yang ingin aku ceritakan. Tentang kamu, tentang kita, dan tentang perasaan yang selama ini mungkin nggak selalu bisa aku tunjukkan dengan baik.</p>
								<p>Aku sadar, mungkin sekarang kita memang hanya sebatas teman. Dan aku juga sadar kalau aku nggak punya hak untuk menentukan siapa yang harus kamu pilih, siapa yang harus kamu sayangi, atau dengan siapa kamu nantinya menjalani hidup. Aku pernah bilang kalau aku ingin kamu memilih aku, dan jujur sampai sekarang pun perasaan itu masih ada. Aku masih punya harapan kalau suatu hari nanti kamu bisa melihat aku lebih dari sekadar teman.</p>

								<p>Tapi di balik semua itu, ada satu hal yang jauh lebih aku inginkan: aku ingin kamu bahagia.</p>

								<p>Bahkan kalau ternyata kebahagiaan itu nantinya bukan bersama aku.</p>
								
								<p>Mungkin kedengarannya aneh, karena siapa juga yang mau melihat orang yang dia sayang bahagia bersama orang lain? Jujur, aku sendiri nggak tahu apakah aku benar-benar akan baik-baik saja kalau hari itu datang. Mungkin sakit, mungkin kecewa, mungkin aku butuh waktu untuk menerima semuanya. Tapi kalau orang yang kamu pilih benar-benar bisa membuatmu bahagia, menghargai kamu, menjaga kamu, dan memperlakukan kamu dengan baik, aku akan belajar untuk menerima pilihanmu.</p>

								<p>Aku nggak mau memaksamu untuk memilih aku hanya karena aku sudah menyayangimu. Aku juga nggak mau membuatmu merasa berutang atas semua perhatian yang pernah aku berikan. Aku memberikan semuanya karena memang aku ingin memberikannya.</p>
								
								<P>Aku memang kadang kurang peka. Kamu cerita panjang lebar, kadang aku malah bingung harus menjawab apa. Kadang aku juga melakukan hal kecil yang tanpa sengaja membuatmu merasa nggak dihargai. Dan jujur, setiap kali itu terjadi, aku selalu kepikiran karena aku nggak pernah punya niat untuk membuatmu merasa seperti itu.</p>
								
								<p>Tapi justru dari semua cerita yang kamu sampaikan kepadaku, aku semakin sadar kalau aku senang ketika kamu mau cerita. Bukan karena aku merasa harus menjadi orang yang selalu menyelesaikan masalahmu, tapi karena aku senang ketika kamu merasa cukup nyaman untuk menceritakan apa yang kamu rasakan.</p>

								<p>Aku ingat ketika kamu cerita tentang Karang Taruna di tempatmu. Tentang bagaimana kamu nggak nyaman ketika dijodoh-jodohkan dengan anak-anak cowok di sana, tentang teman-teman perempuanmu yang menyindir karena kamu baru ikut kegiatan setelah sekian lama, dan tentang hal-hal kecil yang mungkin bagi orang lain terlihat sepele, tapi ternyata cukup mengganggu pikiranmu.</p>

								<p>Mungkin aku nggak selalu punya jawaban yang tepat ketika kamu cerita. Tapi aku ingin kamu tahu, aku tetap suka mendengarkan semuanya. Kamu nggak harus selalu terlihat baik-baik saja di depanku. Kalau kamu sedang marah, kecewa, capek, bete, atau cuma ingin mengeluh, kamu boleh cerita.</p>

								<p>Dan mungkin salah satu momen yang akan selalu aku ingat adalah ketika kita akhirnya teleponan berdua. Entah kenapa, buatku malam itu terasa berbeda. Kita ngobrol banyak hal, kamu cerita, aku juga cerita, dan rasanya sederhana sekali, tapi justru itu yang membuatnya berarti.</p>

								<p>Aku bahkan masih ingat bagaimana malam itu kamu menemani aku bekerja. Di saat emosiku sedang nggak terlalu baik, ngobrol sama kamu ternyata bisa membuat semuanya terasa sedikit lebih ringan. Aku nggak tahu apakah buatmu momen itu berarti atau hanya sekadar teleponan biasa, tapi buatku, aku rasa aku akan mengingatnya cukup lama.</p>

								<p>Bukan karena kita melakukan sesuatu yang luar biasa malam itu. Justru karena kita hanya berbicara dan saling menemani. Tapi dari situ aku sadar, ternyata kehadiran seseorang bisa terasa berarti bahkan tanpa harus melakukan sesuatu yang besar.</p>

								<p>Aku juga ingin kamu tetap bisa menjadi dirimu sendiri. Tetap punya teman-temanmu, tetap bisa bercerita kepada orang-orang yang kamu percaya, tetap bisa melakukan hal-hal yang kamu suka. Aku nggak pernah ingin menjadi orang yang membatasi itu semua.</p>

								<p>Kalau kamu ingin cerita kepada temanmu, ceritakan. Kalau kamu ingin cerita kepada orang yang kamu percaya, silakan. Dan kalau kamu ingin cerita kepadaku, aku juga akan mendengarkan sebisaku. Aku nggak ingin kamu merasa bahwa kamu hanya boleh bergantung kepadaku.</p>

								<p>Mungkin selama ini aku terlalu sering memikirkan bagaimana caranya supaya kamu nggak pergi dariku. Takut kamu menemukan orang lain, takut aku terlambat, takut suatu hari kamu memilih orang lain. Tapi semakin aku memikirkannya, aku sadar bahwa aku nggak bisa menjalani hubungan dengan terus-menerus takut kehilangan.</p>

								<p>Kalau memang suatu hari kamu memilihku, aku ingin kamu memilihku karena memang hatimu menginginkannya. Bukan karena kasihan, bukan karena terpaksa, dan bukan karena aku berhasil membuatmu merasa harus memilihku.</p>

								<p>Dan kalau ternyata bukan aku... aku mungkin akan sakit, tapi aku tetap ingin kamu bahagia.</p>

								<p>Aku nggak tahu sebenarnya aku ini akan menjadi apa dalam hidupmu nantinya. Mungkin tetap menjadi teman, mungkin seseorang yang perlahan semakin dekat, atau mungkin suatu hari kita benar-benar bisa sampai ke sesuatu yang lebih serius seperti yang selama ini aku harapkan.</p>

								<p>Aku nggak tahu.</p>

								<P>Untuk sekarang, aku cuma ingin terus menjadi seseorang yang bisa kamu percaya. Seseorang yang ketika kamu sedang punya masalah, kamu tahu bahwa kamu boleh datang dan cerita tanpa takut dihakimi. Seseorang yang bisa mengingatkanmu kalau kamu salah, mendukungmu ketika kamu sedang jatuh, dan ikut senang ketika kamu sedang bahagia.</p>

								<p>Aku nggak bisa menjanjikan kalau aku akan selalu sempurna. Aku pasti akan salah lagi, mungkin kurang peka lagi, mungkin ada saatnya aku membuatmu kecewa tanpa sengaja. Tapi aku ingin terus belajar supaya aku nggak mengulangi kesalahan yang sama.</p>

								<p>Jadi, Riva... kalau nanti hidup membawa kamu ke seseorang yang memang lebih baik untukmu, aku akan berusaha ikhlas. Aku mungkin nggak langsung bisa tersenyum melihatnya, tapi aku akan belajar menerima bahwa mencintai seseorang nggak selalu berarti harus memilikinya.</p>

								<p>Aku cuma berharap, di mana pun kamu nantinya, dengan siapa pun kamu nantinya, kamu tetap bahagia, tetap dihargai, tetap dijaga, dan nggak pernah merasa sendirian.</p>

								<p>Dan kalau suatu hari ternyata orang yang kamu pilih adalah aku... aku ingin kita sama-sama menjaganya dengan sungguh-sungguh.</p>

								<p>Untuk sekarang, nggak perlu menjawab apa-apa. Aku cuma ingin kamu tahu apa yang sebenarnya ada di dalam pikiranku selama ini. 🤍</P>

								<p>Dengan peluk hangat,</p>
								<p>— Valent</p>
							</div>
						</div>
					</div>
				</div>
			`;

			// Menyimpan frame animasi auto-scroll yang sedang berjalan
			let scrollAnim = null;

			// Membuka modal surat dan menyiapkan semua kontrol di dalamnya
			function openLetter(){
				if(document.getElementById('modal')) document.getElementById('modal').remove();
				document.body.insertAdjacentHTML('beforeend', letterHtml);
				const modal = document.getElementById('modal');
				modal.setAttribute('aria-hidden','false');
				const content = document.getElementById('letterContent');
				const closeBtn = modal.querySelector('.close');
				const resumeButton = modal.querySelector('.resume-scroll');
				let resumeTimer = null;
				// Menampilkan tombol lanjut setelah user menghentikan auto-scroll
				function showResumeButton(){
					if(!resumeButton.classList.contains('is-visible')){
						resumeTimer = setTimeout(()=> resumeButton.classList.add('is-visible'), 300);
					}
				}
				// Menghentikan auto-scroll dan menawarkan tombol untuk melanjutkan
				function stopAutoScroll(){
					if(scrollAnim){
						cancelAnimationFrame(scrollAnim);
						scrollAnim = null;
					}
					showResumeButton();
				}
				// Menutup surat dan menghentikan auto-scroll
				function close(){
					stopAutoScroll();
					if(resumeTimer) clearTimeout(resumeTimer);
					modal.remove();
				}
				closeBtn.addEventListener('click', close);
				modal.querySelector('.modal-overlay').addEventListener('click', close);
				content.addEventListener('wheel', stopAutoScroll, {passive:true});
				content.addEventListener('touchstart', stopAutoScroll, {passive:true});
				content.addEventListener('pointerdown', stopAutoScroll);
				content.addEventListener('keydown', stopAutoScroll);
				resumeButton.addEventListener('click', ()=>{
					resumeButton.classList.remove('is-visible');
					if(resumeTimer) clearTimeout(resumeTimer);
					startAutoScroll();
				});
				// Menjalankan auto-scroll dari posisi saat ini ke bagian paling bawah
				function startAutoScroll(){
					if(content.scrollHeight <= content.clientHeight || content.scrollTop >= content.scrollHeight - content.clientHeight) return;
					const start = content.scrollTop;
					const end = content.scrollHeight - content.clientHeight;
					const isMobile = window.matchMedia('(max-width: 600px)').matches;
					const scrollDistance = end - start;
					const pixelsPerSecond = isMobile ? 30 : 45;
					const duration = Math.max(60000, scrollDistance / pixelsPerSecond * 1000);
					const t0 = performance.now();
					function step(t){
						const p = Math.min(1,(t - t0)/duration);
						content.scrollTop = start + scrollDistance * p;
						if(p < 1) scrollAnim = requestAnimationFrame(step);
						else scrollAnim = null;
					}
					scrollAnim = requestAnimationFrame(step);
				}
				startAutoScroll();
			}

			// Membuka surat dan memulai lagu saat tombol utama ditekan
			real.addEventListener('click', ()=>{
				window.playMusic();
				openLetter();
			});

			// Menghitung posisi baru tombol yang menghindar dari kartu utama
			function moveButton(btn){
				const padding = 12;
				const bw = btn.offsetWidth;
				const bh = btn.offsetHeight;
				const ww = window.innerWidth;
				const wh = window.innerHeight;
				const cardRect = document.querySelector('.card').getBoundingClientRect();
				let left = padding;
				let top = padding;
				for(let attempt = 0; attempt < 40; attempt++){
					const candidateLeft = Math.random() * Math.max(1, ww - bw - padding*2) + padding;
					const candidateTop = Math.random() * Math.max(1, wh - bh - padding*2) + padding;
					const overlapsCard = candidateLeft < cardRect.right + padding && candidateLeft + bw > cardRect.left - padding && candidateTop < cardRect.bottom + padding && candidateTop + bh > cardRect.top - padding;
					if(!overlapsCard){
						left = candidateLeft;
						top = candidateTop;
						break;
					}
				}
				btn.style.position = 'fixed';
				btn.style.left = left + 'px';
				btn.style.top = top + 'px';
			}

			// Memindahkan tombol saat kursor mendekat
			troll.addEventListener('mouseenter', ()=> moveButton(troll));
			troll.addEventListener('mousemove', (e)=>{
				const rect = troll.getBoundingClientRect();
				const dx = e.clientX - (rect.left + rect.width/2);
				const dy = e.clientY - (rect.top + rect.height/2);
				const dist = Math.hypot(dx,dy);
				if(dist < 80) moveButton(troll);
			});

			// Mencegah tombol nakal menjalankan aksi ketika berhasil diklik
			troll.addEventListener('click', (e)=>{ e.preventDefault(); moveButton(troll); });

			// Mengembalikan tombol ke posisi normal setelah ukuran layar berubah
			window.addEventListener('resize', ()=>{
				troll.style.position = '';
				troll.style.left = '';
				troll.style.top = '';
			});
		})();
	</script>
</body>
</html>
